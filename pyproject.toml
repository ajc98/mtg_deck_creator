[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgdeck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]
embed = ["sentence-transformers>=3", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mtgdeck*"]

[project.scripts]
mtgdeck = "mtgdeck.cli:app"
